<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for Badge -->
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="45%" stop-color="#1b4332"/>
      <stop offset="85%" stop-color="#081c15"/>
      <stop offset="100%" stop-color="#040d0a"/>
    </radialGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Frog Dorsal (Green) Gradient -->
    <linearGradient id="frogGreen" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="25%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Frog Dorsal Darker Shadow -->
    <linearGradient id="frogGreenDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Frog Ventral / Throat / Limbs (Orange) Gradient -->
    <linearGradient id="frogOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="20%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="90%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Vibrant Amber Eye Gradient -->
    <radialGradient id="eyeAmber" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-opacity="0.85" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#52b788" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Botanical Leaf Perch -->
  <path d="M 60,370 C 130,420 280,450 430,370 C 370,340 270,335 170,350 C 120,355 80,365 60,370 Z" 
        fill="url(#leafGrad)" opacity="0.95" />
  <path d="M 60,370 C 180,400 320,395 430,370" 
        stroke="#6ee7b7" stroke-width="2.5" fill="none" opacity="0.6" />

  <!-- ================= FROG ANATOMY ================= -->

  <!-- Rear Left Leg (folded back) -->
  <ellipse cx="145" cy="330" rx="42" ry="28" transform="rotate(-25, 145, 330)" fill="url(#frogGreenDark)" />
  <path d="M 120,345 C 95,365 90,395 115,405 C 130,410 155,395 155,375 Z" fill="url(#frogOrange)" />
  <!-- Left hind toes with round suction pads -->
  <circle cx="95" cy="405" r="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="108" cy="418" r="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="126" cy="422" r="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Rear Right Leg (folded flank) -->
  <path d="M 320,310 C 390,315 425,355 405,400 C 385,420 345,410 325,375 C 310,350 310,325 320,310 Z" fill="url(#frogGreenDark)" />
  <path d="M 375,375 C 410,390 425,415 405,435 C 385,445 360,425 355,400 Z" fill="url(#frogOrange)" />
  <!-- Right hind toes with suction pads -->
  <circle cx="420" cy="430" r="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="405" cy="445" r="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="385" cy="450" r="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Frog Belly & Throat (Vibrant Orange Glow) -->
  <path d="M 185,270 C 170,320 180,380 256,395 C 330,380 340,320 325,270 C 300,320 210,320 185,270 Z" 
        fill="url(#frogOrange)" />
  <!-- Throat Sac highlight -->
  <ellipse cx="256" cy="315" rx="55" ry="38" fill="url(#frogOrange)" />
  <ellipse cx="256" cy="305" rx="35" ry="22" fill="#fef08a" opacity="0.45" />

  <!-- Main Frog Body / Back (Dorsal Green) -->
  <path d="M 256,120 
           C 200,120 160,175 165,250 
           C 168,295 185,350 256,365 
           C 327,350 344,295 347,250 
           C 352,175 312,120 256,120 Z" 
        fill="url(#frogGreen)" />

  <!-- Dorsal Ridge & Skin Texture Accent Spots -->
  <ellipse cx="230" cy="220" rx="12" ry="7" transform="rotate(-15, 230, 220)" fill="#065f46" opacity="0.4" />
  <ellipse cx="282" cy="220" rx="12" ry="7" transform="rotate(15, 282, 220)" fill="#065f46" opacity="0.4" />
  <ellipse cx="220" cy="265" rx="10" ry="6" transform="rotate(-25, 220, 265)" fill="#065f46" opacity="0.35" />
  <ellipse cx="292" cy="265" rx="10" ry="6" transform="rotate(25, 292, 265)" fill="#065f46" opacity="0.35" />
  <ellipse cx="256" cy="245" rx="8" ry="14" fill="#6ee7b7" opacity="0.3" />

  <!-- Front Left Foreleg & Orange Digits -->
  <path d="M 180,260 C 150,285 130,325 145,360 C 155,365 170,355 175,335 C 180,310 185,280 180,260 Z" fill="url(#frogGreen)" />
  <path d="M 140,345 C 120,360 115,385 130,395 C 145,400 160,385 155,365 Z" fill="url(#frogOrange)" />
  <!-- Front Left Toe Discs -->
  <circle cx="112" cy="385" r="8" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="122" cy="400" r="8" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="138" cy="406" r="8" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Front Right Foreleg & Orange Digits -->
  <path d="M 332,260 C 362,285 382,325 367,360 C 357,365 342,355 337,335 C 332,310 327,280 332,260 Z" fill="url(#frogGreen)" />
  <path d="M 372,345 C 392,360 397,385 382,395 C 367,400 352,385 357,365 Z" fill="url(#frogOrange)" />
  <!-- Front Right Toe Discs -->
  <circle cx="400" cy="385" r="8" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="390" cy="400" r="8" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="374" cy="406" r="8" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Head Contour & Snout -->
  <path d="M 210,165 C 225,140 256,135 285,145 C 302,165 315,195 305,215 C 285,225 225,225 205,215 C 195,195 200,175 210,165 Z" 
        fill="url(#frogGreen)" />
  <path d="M 235,145 C 248,138 264,138 277,145" stroke="#a7f3d0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Left Eye Orbit & Eye (Bulging Herpetological Eye) -->
  <circle cx="198" cy="168" r="34" fill="#047857" />
  <circle cx="198" cy="168" r="30" fill="url(#eyeAmber)" />
  <!-- Pupil (Horizontal/Elliptical Amphibian Pupil) -->
  <ellipse cx="198" cy="168" rx="18" ry="10" fill="#0b0f0e" />
  <!-- Eye Light Highlights -->
  <circle cx="188" cy="158" r="6" fill="#ffffff" opacity="0.9" />
  <circle cx="204" cy="174" r="3" fill="#ffffff" opacity="0.6" />
  <!-- Upper Eyelid Arch -->
  <path d="M 172,156 C 185,140 212,140 225,156" stroke="#6ee7b7" stroke-width="4.5" fill="none" stroke-linecap="round" />

  <!-- Right Eye Orbit & Eye -->
  <circle cx="314" cy="168" r="34" fill="#047857" />
  <circle cx="314" cy="168" r="30" fill="url(#eyeAmber)" />
  <!-- Pupil -->
  <ellipse cx="314" cy="168" rx="18" ry="10" fill="#0b0f0e" />
  <!-- Eye Light Highlights -->
  <circle cx="304" cy="158" r="6" fill="#ffffff" opacity="0.9" />
  <circle cx="320" cy="174" r="3" fill="#ffffff" opacity="0.6" />
  <!-- Upper Eyelid Arch -->
  <path d="M 287,156 C 300,140 327,140 340,156" stroke="#6ee7b7" stroke-width="4.5" fill="none" stroke-linecap="round" />

  <!-- Nostrils -->
  <ellipse cx="247" cy="152" rx="2" ry="3" fill="#064e3b" />
  <ellipse cx="265" cy="152" rx="2" ry="3" fill="#064e3b" />

  <!-- Mouth Line & Jaw -->
  <path d="M 180,205 C 220,230 292,230 332,205" stroke="#047857" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <!-- Subtle Amber Lower Lip Glow -->
  <path d="M 195,212 C 230,232 282,232 317,212" stroke="#f97316" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Tympanic Membrane (Ear spots typical of anurans) -->
  <circle cx="160" cy="205" r="11" fill="#065f46" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
  <circle cx="352" cy="205" r="11" fill="#065f46" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>

  <!-- Elegant Inner Congress Laurel / Decorative Arc at bottom -->
  <path d="M 120,256 A 150,150 0 0,0 256,406 A 150,150 0 0,0 392,256" 
        stroke="#52b788" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity="0.3" />
</svg>